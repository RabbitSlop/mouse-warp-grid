[package]
name = "mouse-warp-grid"
version = "0.1.0"
edition = "2021"
description = "Keyboard-driven mouse warp tool for Wayland/Niri"

[[bin]]
name = "mouse-warp-grid"
path = "src/main.rs"

[dependencies]
# Wayland client toolkit – layer shell, keyboard, shm drawing
smithay-client-toolkit = { version = "0.19", features = ["calloop"] }

# Raw Wayland protocol bindings (wlr virtual pointer lives here)
wayland-client    = "0.31"
wayland-protocols-wlr = "0.3"
# Standard/staging protocols (wp_pointer_warp_v1 – cursor warp on KWin, Mutter, …)
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Pure-Rust 2D rasteriser – no system graphics deps required
tiny-skia = "0.11"

# Event loop
calloop = "0.13"
calloop-wayland-source = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
